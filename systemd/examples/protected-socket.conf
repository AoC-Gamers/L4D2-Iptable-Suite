# Copy explicitly to each protected SERVICE.socket.d/10-l4d2-firewall.conf.
# Also protect its activated .service with protected-service.conf.
[Unit]
# A socket normally orders itself before sockets.target/basic.target. The full
# policy may depend on Docker after basic.target; remove that automatic cycle
# and retain explicit initialization/shutdown dependencies. Review per socket.
DefaultDependencies=no
After=sysinit.target
Conflicts=shutdown.target
Before=shutdown.target
Requires=l4d2-firewall-ready.service
After=l4d2-firewall-ready.service
