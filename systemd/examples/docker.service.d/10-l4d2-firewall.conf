# Explicit opt-in only. Review existing ExecStop directives before installation.
[Unit]
Requires=l4d2-firewall-guard.service
After=l4d2-firewall-guard.service

[Service]
ExecStartPre=/usr/bin/python3 -I /opt/l4d2-firewall/core/fw.py boot-guard
ExecStartPost=/usr/bin/python3 -I /opt/l4d2-firewall/core/fw.py boot-restore
# Executed before systemd terminates the daemon, protecting live-restored loads.
ExecStop=/usr/bin/python3 -I /opt/l4d2-firewall/core/fw.py boot-guard
