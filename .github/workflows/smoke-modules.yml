name: Firewall validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck and Bash syntax
        run: |
          git ls-files -z -- '*.sh' ':(exclude)log-summary/venv.loggin.sh' | xargs -0 shellcheck -x
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n
          python3 -m compileall -q core scripts tests
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/test_core.py
      - run: python3 -I tests/test_geoip.py
      - run: python3 -I tests/test_transactions.py
      - run: python3 -I tests/test_configuration_audit.py
      - run: python3 -I tests/test_policy_audit.py
      - run: python3 -I tests/test_docker_topology.py
      - run: python3 -I tests/test_h2.py
      - run: python3 -I tests/test_boot.py
      - run: python3 -I tests/vm/test_transactions_harness.py
      - run: python3 -I tests/vm/test_boot_harness.py
      - run: python3 -I tests/vm/test_boot_cleanup.py
      - run: python3 -I tests/vm/test_runner.py
      - run: bash tests/watcher-audit.sh
      - run: bash tests/http-https-protect.sh && bash tests/public-ip-watch.sh
  generation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/generate.sh
  kernel-check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        frontend: [nft, legacy]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iptables nftables iproute2 util-linux
      - name: Load required modules in the disposable GitHub runner VM
        run: sudo modprobe ip6_tables && sudo modprobe ip6table_nat && sudo modprobe xt_u32
      - name: Check all candidates in an isolated network namespace
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/check-engine.py
  traffic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        frontend: [nft, legacy]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iptables nftables iproute2 util-linux
      - run: sudo modprobe ip6_tables && sudo modprobe ip6table_nat && sudo modprobe xt_u32
      - name: Real traffic, rollback, concurrency and foreign-state preservation
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/integration.py
      - name: Transaction recovery regressions against real engines
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/transaction-flows.py
      - name: Policy capacity and scope regressions with real traffic
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/policy-flows.py
      - name: Docker hook topology with real engines
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/docker-topology-flows.py
      - name: Normalized state full lifecycle and traffic
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/h2-flows.py
      - name: Early barrier IPv4/IPv6 packets and rollback to empty
        run: sudo env SUITE_TEST_FRONTEND=${{ matrix.frontend }} bash tests/isolated-run.sh --root-net tests/boot-flows.py
