name: Disposable QEMU validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - name: Check runner without starting QEMU
        run: python3 -I tests/vm/test_runner.py
      - name: Install host QEMU and seed-image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acl genisoimage openssh-client openssl qemu-system-x86 qemu-utils
      - name: Allow runner user to use KVM when available
        run: |
          if [ -c /dev/kvm ]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'KVM device available to the unprivileged QEMU runner'
          else
            echo 'KVM device unavailable; full validation will use TCG'
          fi
      - name: Run full validation in a disposable QEMU guest
        run: python3 -I tests/vm/run.py --artifacts-dir tmp/vm-runner-artifacts
      - name: Upload sanitized VM logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: qemu-validation-logs
          path: tmp/vm-runner-artifacts/**
          if-no-files-found: error
          retention-days: 14
          archive: true
