# Example: existing VPN client/tunnel used as a LAN gateway beside Docker.
# Replace documentation addresses/interfaces; this grants every protocol VPN -> LAN.
PROFILE=host-minimal
MODULES_ONLY=tcp_ssh,openvpn_sitetosite
FAMILY_POLICY=dual
HOST_SERVICES=true
CONTAINER_POLICY=off
ROUTED_POLICY=unmanaged
DOCKER_BACKEND=iptables
IPTABLES_FRONTEND=nft
SSH_PORT=22
ADMIN_SOURCES=192.0.2.0/24,10.8.0.0/24
OVPNS2S_INTERFACE=tun0
OVPNS2S_LOCAL_INTERFACE=lan0
OVPNS2S_LOCAL_SUBNETS=192.0.2.0/24
OVPNS2S_REMOTE_SUBNETS=10.8.0.0/24
OVPNS2S_ENABLE_NAT=true
OVPNS2S_ALLOW_LAN=true
