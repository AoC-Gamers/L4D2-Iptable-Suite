PROFILE=vpn-gateway
FAMILY_POLICY=dual
HOST_SERVICES=true
ROUTED_POLICY=drop
CONTAINER_POLICY=off
SSH_PORT=22
OVPNSRV_PROTO=udp
OVPNSRV_PORT=1194
OVPNSRV_INTERFACE=tun0
OVPNSRV_SUBNET=10.8.0.0/24
OVPNSRV_LAN_SUBNET=192.0.2.0/24
OVPNSRV_LAN_INTERFACE=lan0
OVPNSRV_ENABLE_NAT=false
# NAT does not grant forwarding. Explicit grants are required below.
ACCESS_POLICY=config/access.example.json
